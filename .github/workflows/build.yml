name: Build MW4-RR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/sss-noise-fixes

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout claude/sss-noise-fixes branch
        uses: actions/checkout@v4
        with:
          ref: claude/sss-noise-fixes

      - name: Download NGX Headers, DXC 1.8.2505.1, and Build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "1. Cloning NVIDIA DLSS/NGX SDK headers..."
          git clone --depth 1 https://github.com/NVIDIA/DLSS.git external_ngx
          $ngxHeader = Get-ChildItem -Path external_ngx -Filter nvsdk_ngx.h -Recurse | Select-Object -First 1
          if (-not $ngxHeader) { throw "nvsdk_ngx.h not found!" }
          $ngxInc = $ngxHeader.DirectoryName
          Write-Host "Found NGX include directory: $ngxInc"

          Write-Host "2. Downloading Microsoft DirectXShaderCompiler v1.8.2505.1..."
          New-Item -ItemType Directory -Force -Path external_dxc | Out-Null
          gh release download v1.8.2505.1 --repo microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" -D external_dxc
          $dxcZip = Get-ChildItem -Path external_dxc -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $dxcZip.FullName -DestinationPath external_dxc\extracted -Force
          $dxcExe = Get-ChildItem -Path external_dxc\extracted -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $dxcExe) { throw "dxc.exe (x64) not found!" }
          $dxcBin = $dxcExe.DirectoryName
          Write-Host "Found DXC bin\x64 directory: $dxcBin"

          Write-Host "3. Running build.cmd..."
          & .\build.cmd "$ngxInc" "$dxcBin"
          if ($LASTEXITCODE -ne 0) { throw "build.cmd failed with exit code $LASTEXITCODE" }

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: MW4-RR-sss-noise-fixes
          path: |
            build/mw4-rr.addon64
            build/mw4-rr-dxcompiler.dll
