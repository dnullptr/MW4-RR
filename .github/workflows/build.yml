name: Build MW4-RR

on:
  workflow_dispatch:
  push:
    branches:
      - claude/sss-noise-fixes

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Project (CMake or MSBuild)
        shell: pwsh
        run: |
          if (Test-Path "CMakeLists.txt") {
            Write-Host "Building with CMake..."
            cmake -B build -A x64
            cmake --build build --config Release
          } else {
            $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
            if ($sln) {
              Write-Host "Building Solution: $($sln.FullName)"
              msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64
            } else {
              $vcxproj = Get-ChildItem -Path . -Filter *.vcxproj -Recurse | Select-Object -First 1
              if ($vcxproj) {
                Write-Host "Building Project: $($vcxproj.FullName)"
                msbuild $vcxproj.FullName /m /p:Configuration=Release /p:Platform=x64
              } else {
                Write-Error "No CMakeLists.txt, .sln, or .vcxproj found!"
                exit 1
              }
            }
          }

      - name: Collect Compiled Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact_out | Out-Null
          Get-ChildItem -Path . -Include *.addon64, *.addon, *.dll -Recurse |
            Where-Object { $_.FullName -notmatch "\\\.git\\" -and $_.FullName -notmatch "\\artifact_out\\" } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination "artifact_out\" -Force
            }
          Get-ChildItem -Path artifact_out

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: MW4-RR-compiled-files
          path: artifact_out/*
